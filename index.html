<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Silsilah Keluarga : Abadi 016</title>
    <!-- Memuat Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat D3.js untuk visualisasi grafik pohon -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow: hidden; 
        }
        
        #tree-container {
            width: 100vw;
            height: 100vh;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
            cursor: grab;
            touch-action: none; 
        }

        #tree-container:active {
            cursor: grabbing;
        }

        .link { fill: none; stroke: #94a3b8; stroke-width: 3.5px; }
        .node-rect { cursor: pointer; transition: stroke 0.2s; }
        .node-main { rx: 16; ry: 16; }
        .node-spouse { rx: 16; ry: 16; }
        .text-main-name { font-weight: bold; font-size: 14px; fill: #ffffff; text-anchor: middle; pointer-events: none; }
        .text-spouse-name { font-weight: bold; font-size: 14px; fill: #0f172a; text-anchor: middle; pointer-events: none; }
        .text-main-detail { font-size: 11px; fill: #eff6ff; text-anchor: middle; pointer-events: none; }
        .text-spouse-detail { font-size: 11px; fill: #475569; text-anchor: middle; pointer-events: none; }
        .couple-link { stroke: #64748b; stroke-width: 3.5px; }
        
        .collapse-btn { cursor: pointer; }

        #member-modal {
            display: none;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 50;
        }

        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.5s, bottom 0.5s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        @media print {
            body { background-color: #fff; }
            #ui-panel, #member-modal, #toast { display: none !important; }
        }
    </style>
</head>
<body>

    <!-- Panel UI (Dioptimalkan Khusus Lansia: Teks Lebih Besar & Tombol Jelas) -->
    <div id="ui-panel" class="fixed z-20 bg-white/95 backdrop-blur-md border-gray-200 shadow-2xl transition-transform duration-300 bottom-0 left-0 w-full rounded-t-3xl border-t px-6 pb-6 pt-3 max-h-[75vh] flex flex-col md:bottom-auto md:top-6 md:left-6 md:w-[380px] md:rounded-2xl md:border md:max-h-[92vh] md:py-6">
        
        <!-- Handle Swipe Mobile -->
        <div id="mobile-handle" class="md:hidden flex justify-center mb-2 py-3 cursor-pointer w-full" onclick="toggleMobilePanel()">
            <div class="w-16 h-2 bg-gray-300 rounded-full"></div>
        </div>

        <div class="overflow-y-auto flex-1 pr-1" id="panel-content">
            <div class="flex items-center justify-between mb-2">
                <h1 class="text-3xl font-black text-blue-900 tracking-tight">Abadi Family 016</h1>
                <span id="cloud-status" class="text-xs bg-green-100 text-green-800 px-3 py-1 rounded-full font-bold shadow-sm">Cloud Aktif ☁️</span>
            </div>
            <p class="text-base text-gray-600 mb-4 font-medium leading-normal">Peta visual silsilah keluarga.</p>
            
            <!-- Fitur Pencarian Anggota Keluarga -->
            <div class="mb-4 relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Cari Nama Keluarga..." class="w-full pl-11 pr-4 py-3 bg-gray-50 border-2 border-gray-300 rounded-2xl text-base font-semibold text-gray-900 focus:outline-none focus:border-blue-600 transition-all shadow-inner">
                <div id="search-results" class="absolute left-0 right-0 mt-1 bg-white border-2 border-gray-200 rounded-2xl shadow-xl max-h-56 overflow-y-auto z-30 hidden"></div>
            </div>

            <!-- Banner Mode Filter Keluarga -->
            <div id="filter-banner" class="hidden mb-4 bg-indigo-50 border-2 border-indigo-300 p-4 rounded-2xl flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs text-indigo-600 font-extrabold uppercase tracking-wider">Sedang Fokus Melihat</p>
                    <p id="filter-banner-text" class="text-sm font-bold text-indigo-950 mt-0.5">Keluarga Bpk. ...</p>
                </div>
                <button onclick="resetFamilyFilter()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-colors shadow">Tampilkan Semua</button>
            </div>

            <div id="empty-state" class="text-center py-4">
                <button onclick="openModal('root')" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 px-6 rounded-2xl transition duration-300 shadow-lg text-lg flex items-center justify-center gap-2">
                    <span class="text-2xl leading-none">+</span> Tambah Leluhur Utama
                </button>
                <p class="text-sm text-gray-500 mt-3 font-semibold">MULAI DARI KAKEK ATAU NENEK BUYUT</p>
            </div>

            <!-- Info Panel Yang Dipilih -->
            <div id="selected-info" class="hidden mt-2 pt-4 border-t-2 border-gray-200">
                <h2 class="text-xs font-black text-gray-500 uppercase tracking-widest mb-3">Anggota Terpilih</h2>
                
			<!-- Kotak Anggota Utama (Diperbaiki agar tidak mepet) -->
			<div class="bg-blue-900 text-white p-5 rounded-2xl mb-3 shadow-md border-2 border-blue-800 space-y-2">
			<p class="text-xs text-blue-200 font-bold tracking-wider">GARIS KETURUNAN UTAMA</p>
			<p id="info-name" class="font-black text-xl text-white leading-snug">-</p>
			<p id="info-detail" class="text-sm text-blue-100 font-medium leading-relaxed pt-1">-</p>
			</div>

                <!-- Bagian Pilihan Pasangan (Menggantikan Dropdown agar tidak bikin pusing) -->
                <div id="spouse-container-box" class="mb-3" style="display: none;">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-xs text-gray-700 font-black uppercase tracking-wider">PILIH PASANGAN</label>
                        <button onclick="openModal('add_spouse')" class="text-xs text-blue-700 font-extrabold hover:underline flex items-center gap-1 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200">+ Tambah Pasangan Lain</button>
                    </div>
                    <!-- Tombol Tab Pasangan (Pengganti Dropdown) -->
                    <div id="spouse-tabs-container" class="flex flex-wrap gap-2 mb-2">
                        <!-- Diisi dinamis via JS -->
                    </div>
                </div>

                <!-- Kotak Info Pasangan Aktif -->
                <div id="spouse-info-box" class="bg-gray-100 p-4 rounded-2xl border-2 border-gray-300 mb-4 shadow-sm">
                    <p id="info-spouse-name" class="font-extrabold text-lg text-gray-900">-</p>
                    <p id="info-spouse-detail" class="text-sm text-gray-600 mt-1 font-medium">-</p>
                </div>
                
                <!-- Tombol Aksi Utama -->
                <div class="space-y-3">
                    <button onclick="isolateFamilyView()" class="w-full bg-purple-700 hover:bg-purple-800 text-white text-base font-bold py-3.5 px-4 rounded-2xl transition duration-300 shadow-md flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        Fokus Lihat Keluarga Ini Saja
                    </button>
                    <button onclick="openModal('child')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white text-base font-bold py-4 px-4 rounded-2xl transition duration-300 shadow-lg flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" /></svg>
                        Tambah Anak
                    </button>
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <button onclick="openModal('edit')" class="bg-white hover:bg-gray-100 border-2 border-gray-300 text-gray-800 text-base font-bold py-3 px-3 rounded-2xl transition shadow-sm">Ubah Data</button>
                        <button onclick="confirmDelete()" class="bg-red-50 hover:bg-red-100 border-2 border-red-200 text-red-700 text-base font-bold py-3 px-3 rounded-2xl transition shadow-sm">Hapus Data</button>
                    </div>
                </div>
            </div>

            <!-- Tombol Aksi Global -->
            <div class="mt-5 pt-4 border-t-2 border-gray-200 space-y-3">
                 <button onclick="resetView()" class="w-full bg-gray-100 border-2 border-gray-300 hover:bg-gray-200 text-gray-800 text-base font-bold py-3.5 px-4 rounded-2xl transition shadow-sm flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                    Posisikan ke Tengah Layar
                </button>
                <button onclick="downloadTreeImage()" class="w-full bg-indigo-800 hover:bg-indigo-900 text-white text-base font-bold py-3.5 px-4 rounded-2xl transition shadow-lg flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Unduh Gambar Silsilah
                </button>
            </div>
        </div>
    </div>

    <!-- Elemen Toast untuk Notifikasi -->
    <div id="toast">Notifikasi</div>

    <!-- Modal Form Tambah/Edit -->
    <div id="member-modal" class="fixed inset-0 flex items-center justify-center p-4 z-50 backdrop-blur-sm bg-gray-900/60" style="display: none;">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-6 md:p-8 relative max-h-[95vh] overflow-y-auto border-2 border-gray-200">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-500 hover:text-gray-900 bg-gray-100 hover:bg-gray-200 rounded-full p-2.5 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            
            <h2 id="modal-title" class="text-2xl font-black text-gray-900 mb-6">Tambah Anggota</h2>
            
            <form id="member-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-action"> 

                <!-- Pilihan Pasangan untuk Tambah Anak -->
                <div id="child-spouse-section" class="mb-5 bg-indigo-50 p-4 rounded-2xl border-2 border-indigo-200 shadow-sm" style="display: none;">
                    <label class="block text-indigo-950 text-sm font-black mb-2 uppercase" for="childSpouseIndex">Anak dari Pasangan / Istri Ke-:</label>
                    <select id="childSpouseIndex" class="w-full bg-white border-2 border-indigo-300 rounded-xl p-3 text-sm font-bold text-indigo-950 focus:outline-none focus:border-indigo-600">
                        <!-- Diisi dinamis via JS -->
                    </select>
                </div>

                <!-- Pengaturan Urutan Anak -->
                <div id="edit-sibling-section" class="mb-5 bg-amber-50 p-4 rounded-2xl border-2 border-amber-300 shadow-sm" style="display: none;">
                    <label class="block text-amber-950 text-sm font-black mb-2 uppercase" for="editSiblingPosition">Ubah Urutan Anak ke-:</label>
                    <input class="shadow-inner appearance-none border-2 border-amber-300 rounded-xl w-full py-3 px-3.5 text-amber-950 bg-white leading-tight focus:outline-none focus:border-amber-600 text-sm font-bold" id="editSiblingPosition" type="number" min="1" placeholder="Contoh: 1, 2, atau 3">
                </div>
                
                <div id="main-person-section" class="bg-blue-50/70 p-5 rounded-2xl border-2 border-blue-200 mb-5 shadow-sm">
                    <h3 id="main-section-title" class="text-sm font-black text-blue-900 mb-3 uppercase tracking-wider">Data Anggota Utama</h3>
                    <div class="mb-4">
                        <label class="block text-gray-800 text-sm font-bold mb-1.5" for="name">Nama Lengkap *</label>
                        <input class="shadow-inner appearance-none border-2 border-gray-300 rounded-xl w-full py-3 px-3.5 text-gray-900 text-base font-semibold leading-tight focus:outline-none focus:border-blue-600 bg-white" id="name" type="text" placeholder="Contoh: Budi Santoso" required>
                    </div>
                    
                    <div class="mb-4 flex items-center gap-3 bg-white p-3 rounded-xl border-2 border-gray-300">
                        <input type="checkbox" id="mainAlm" class="w-5 h-5 text-blue-700 rounded focus:ring-blue-600 border-gray-300">
                        <label for="mainAlm" class="text-sm text-gray-900 font-bold cursor-pointer">Sudah Almarhum / Almarhumah</label>
                    </div>

                    <div>
                        <label class="block text-gray-800 text-sm font-bold mb-1.5" for="birthYear">Tahun Lahir (Opsional)</label>
                        <input class="shadow-inner appearance-none border-2 border-gray-300 rounded-xl w-full py-3 px-3.5 text-gray-900 text-base font-semibold leading-tight focus:outline-none focus:border-blue-600 bg-white" id="birthYear" type="number" placeholder="Contoh: 1950">
                    </div>
                </div>

                <div id="spouse-section" class="bg-gray-50 p-5 rounded-2xl border-2 border-gray-300 mb-6 shadow-sm">
                    <h3 class="text-sm font-black text-gray-700 mb-3 uppercase tracking-wider">Data Suami / Istri (Menantu)</h3>
                    <div class="mb-4">
                        <label class="block text-gray-800 text-sm font-bold mb-1.5" for="spouseName">Nama Pasangan</label>
                        <input class="shadow-inner appearance-none border-2 border-gray-300 rounded-xl w-full py-3 px-3.5 text-gray-900 text-base font-semibold leading-tight focus:outline-none focus:border-gray-500 bg-white" id="spouseName" type="text" placeholder="Kosongkan jika belum ada">
                    </div>
                    
                    <div class="mb-4 flex items-center gap-3 bg-white p-3 rounded-xl border-2 border-gray-300">
                        <input type="checkbox" id="spouseAlm" class="w-5 h-5 text-blue-700 rounded focus:ring-blue-600 border-gray-300">
                        <label for="spouseAlm" class="text-sm text-gray-900 font-bold cursor-pointer">Pasangan Sudah Almarhum / Almarhumah</label>
                    </div>

                    <div>
                        <label class="block text-gray-800 text-sm font-bold mb-1.5" for="spouseBirthYear">Tahun Lahir Pasangan</label>
                        <input class="shadow-inner appearance-none border-2 border-gray-300 rounded-xl w-full py-3 px-3.5 text-gray-900 text-base font-semibold leading-tight focus:outline-none focus:border-gray-500 bg-white" id="spouseBirthYear" type="number" placeholder="Contoh: 1952">
                    </div>
                </div>
                
                <div class="flex items-center justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3.5 px-6 rounded-xl text-base transition">Batal</button>
                    <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 px-8 rounded-xl text-base shadow-lg transition">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Area Kanvas D3.js -->
    <div id="tree-container"></div>

    <!-- Seluruh Logika JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let familyData = []; 
        let nextId = 1; 
        let selectedNodeId = null; 
        let activeSpouseIndices = {}; 
        let isolatedParentId = null; 
        let isolatedSpouseIndex = null; 
        let collapsedNodeIds = {}; 
        let isFirstLoad = true;

        const container = document.getElementById('tree-container');
        const baseRectWidth = 180;
        const rectHeight = 70;
        const coupleGap = 20; 
        
        const svg = d3.select("#tree-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%");
        
        const defs = svg.append("defs");
        
        const filter = defs.append("filter").attr("id", "drop-shadow").attr("x", "-20%").attr("y", "-20%").attr("width", "140%").attr("height", "140%");
        filter.append("feDropShadow").attr("dx", "0").attr("dy", "5").attr("stdDeviation", "6").attr("flood-opacity", "0.15");

        const filterActive = defs.append("filter").attr("id", "drop-shadow-active").attr("x", "-20%").attr("y", "-20%").attr("width", "140%").attr("height", "140%");
        filterActive.append("feDropShadow").attr("dx", "0").attr("dy", "8").attr("stdDeviation", "10").attr("flood-color", "#2563eb").attr("flood-opacity", "0.5");

        const gradMain = defs.append("linearGradient").attr("id", "grad-main").attr("x1", "0%").attr("y1", "0%").attr("x2", "100%").attr("y2", "100%");
        gradMain.append("stop").attr("offset", "0%").attr("stop-color", "#3b82f6"); 
        gradMain.append("stop").attr("offset", "100%").attr("stop-color", "#1d4ed8"); 

        const gradSpouse = defs.append("linearGradient").attr("id", "grad-spouse").attr("x1", "0%").attr("y1", "0%").attr("x2", "100%").attr("y2", "100%");
        gradSpouse.append("stop").attr("offset", "0%").attr("stop-color", "#ffffff");
        gradSpouse.append("stop").attr("offset", "100%").attr("stop-color", "#f1f5f9"); 

        const g = svg.append("g");
        const zoom = d3.zoom().scaleExtent([0.1, 3]).on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);
        
        const treeLayout = d3.tree()
            .nodeSize([baseRectWidth * 2 + 90, rectHeight + 120])
            .separation((a, b) => a.parent == b.parent ? 1 : 1.2);

        function calculateBoxWidth(name) {
            if (!name) return baseRectWidth;
            const approxWidth = name.length * 8 + 50;
            return Math.max(baseRectWidth, approxWidth);
        }

        window.toggleCollapse = function(event, id) {
            event.stopPropagation(); 
            collapsedNodeIds[id] = !collapsedNodeIds[id];
            updateTree();
            showToast(collapsedNodeIds[id] ? "Cabang keturunan dilipat" : "Cabang keturunan dibuka");
        };

        function getChildIndexLabel(nodeData) {
            if (!nodeData.parentId) return ""; 
            const mySpouseIdx = nodeData.parentSpouseIndex !== undefined ? nodeData.parentSpouseIndex : 0;
            
            const sameMotherSiblings = familyData.filter(n => {
                if (n.parentId !== nodeData.parentId) return false;
                const sIdx = n.parentSpouseIndex !== undefined ? n.parentSpouseIndex : 0;
                return sIdx === mySpouseIdx;
            });

            const index = sameMotherSiblings.findIndex(n => n.id === nodeData.id);
            if (index !== -1) {
                return `Anak ke-${index + 1} (Istri ${mySpouseIdx + 1})`;
            }
            return "";
        }

        function updateTree() {
            g.selectAll("*").remove();

            const emptyState = document.getElementById('empty-state');
            if (familyData.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            try {
                if (isFirstLoad) {
                    familyData.forEach(n => {
                        if (n.parentId) {
                            const parentNode = familyData.find(p => p.id === n.parentId);
                            if (parentNode && parentNode.parentId) {
                                collapsedNodeIds[n.parentId] = true;
                            }
                        }
                    });
                    isFirstLoad = false;
                }

                let activeData = familyData;
                if (isolatedParentId) {
                    const getSubtreeIds = (parentId, targetSpouseIdx) => {
                        let ids = [parentId];
                        const children = familyData.filter(n => {
                            if (n.parentId !== parentId) return false;
                            if (parentId === isolatedParentId && targetSpouseIdx !== null && targetSpouseIdx !== undefined) {
                                const sIdx = n.parentSpouseIndex !== undefined ? n.parentSpouseIndex : 0;
                                return sIdx === targetSpouseIdx;
                            }
                            return true;
                        });
                        for (const child of children) {
                            ids = ids.concat(getSubtreeIds(child.id, null));
                        }
                        return ids;
                    };

                    const validIds = getSubtreeIds(isolatedParentId, isolatedSpouseIndex);
                    activeData = familyData.filter(n => validIds.includes(n.id)).map(n => {
                        if (n.id === isolatedParentId) return { ...n, parentId: null }; 
                        return { ...n };
                    });
                }

                const hiddenIds = new Set();
                const getHiddenDescendantIds = (parentId) => {
                    let hIds = [];
                    const children = activeData.filter(n => n.parentId === parentId);
                    for (const c of children) {
                        hIds.push(c.id);
                        hIds = hIds.concat(getHiddenDescendantIds(c.id));
                    }
                    return hIds;
                };

                for (const id in collapsedNodeIds) {
                    if (collapsedNodeIds[id]) {
                        getHiddenDescendantIds(id).forEach(hid => hiddenIds.add(hid));
                    }
                }

                const filteredTreeData = activeData.filter(n => !hiddenIds.has(n.id));
                const root = d3.stratify().id(d => d.id).parentId(d => d.parentId)(filteredTreeData);
                treeLayout(root);

                g.selectAll(".link")
                    .data(root.links())
                    .enter().append("path")
                    .attr("class", "link")
                    .attr("d", d => {
                        const startX = d.source.x;
                        const startY = d.source.y + (rectHeight / 2); 
                        const endX = d.target.x;
                        const endY = d.target.y - (rectHeight / 2);   
                        return `M${startX},${startY} C${startX},${(startY + endY) / 2} ${endX},${(startY + endY) / 2} ${endX},${endY}`;
                    });

                const nodeGroup = g.selectAll(".node")
                    .data(root.descendants())
                    .enter().append("g")
                    .attr("class", "node")
                    .attr("transform", d => `translate(${d.x},${d.y})`)
                    .on("click", (event, d) => selectNode(d.data)); 

                nodeGroup.each(function(d) {
                    const group = d3.select(this);
                    const spouses = d.data.spouses || [];
                    const activeIdx = activeSpouseIndices[d.data.id] || 0;
                    const currentSpouse = spouses[activeIdx] || null;
                    const hasSpouse = !!currentSpouse && !!currentSpouse.name;
                    const isSelected = selectedNodeId === d.data.id;

                    const mainWidth = calculateBoxWidth(d.data.name);
                    const spouseWidth = hasSpouse ? calculateBoxWidth(currentSpouse.name) : 0;
                    const mainX = hasSpouse ? -(mainWidth + (coupleGap/2)) : -(mainWidth / 2);
                    
                    // Kotak Utama
                    group.append("rect")
                        .attr("class", "node-rect node-main")
                        .attr("x", mainX)
                        .attr("y", -(rectHeight / 2))
                        .attr("width", mainWidth)
                        .attr("height", rectHeight)
                        .attr("fill", "url(#grad-main)")
                        .attr("filter", isSelected ? "url(#drop-shadow-active)" : "url(#drop-shadow)")
                        .attr("stroke", isSelected ? "#ffffff" : "rgba(255,255,255,0.4)")
                        .attr("stroke-width", isSelected ? "4px" : "1.5px");

                    group.append("text")
                        .attr("class", "text-main-name")
                        .attr("x", mainX + (mainWidth/2))
                        .attr("y", -14)
                        .attr("font-size", "14px")
                        .text(d.data.name || "");

                    let details = [];
                    const childNumLabel = getChildIndexLabel(d.data);
                    if (childNumLabel) details.push(childNumLabel);
                    if (d.data.mainAlm) details.push("Alm.");
                    if (d.data.birthYear) details.push(d.data.birthYear);

                    group.append("text")
                        .attr("class", "text-main-detail")
                        .attr("x", mainX + (mainWidth/2))
                        .attr("y", 10)
                        .attr("font-size", "11px")
                        .text(details.join(" • "));

                    // Kotak Pasangan
                    if (hasSpouse) {
                        const spouseX = coupleGap / 2;

                        group.append("line")
                            .attr("class", "couple-link")
                            .attr("x1", mainX + mainWidth)
                            .attr("y1", 0)
                            .attr("x2", spouseX)
                            .attr("y2", 0);

                        group.append("rect")
                            .attr("class", "node-rect node-spouse")
                            .attr("x", spouseX)
                            .attr("y", -(rectHeight / 2))
                            .attr("width", spouseWidth)
                            .attr("height", rectHeight)
                            .attr("fill", "url(#grad-spouse)")
                            .attr("filter", isSelected ? "url(#drop-shadow-active)" : "url(#drop-shadow)")
                            .attr("stroke", isSelected ? "#2563eb" : "#cbd5e1")
                            .attr("stroke-width", isSelected ? "4px" : "1.5px");

                        group.append("text")
                            .attr("class", "text-spouse-name")
                            .attr("x", spouseX + (spouseWidth/2))
                            .attr("y", -14)
                            .attr("font-size", "14px")
                            .text(currentSpouse.name || "");

                        let spouseDetails = [];
                        if (spouses.length > 1) spouseDetails.push(`Istri ${activeIdx + 1}/${spouses.length}`);
                        if (currentSpouse.spouseAlm) spouseDetails.push("Alm.");
                        if (currentSpouse.spouseBirthYear) spouseDetails.push(currentSpouse.spouseBirthYear);

                        group.append("text")
                            .attr("class", "text-spouse-detail")
                            .attr("x", spouseX + (spouseWidth/2))
                            .attr("y", 10)
                            .attr("font-size", "11px")
                            .text(spouseDetails.join(" • "));
                    }

                    const hasChildren = familyData.some(n => n.parentId === d.data.id);
                    if (hasChildren) {
                        const isCollapsed = !!collapsedNodeIds[d.data.id];
                        const btnGroup = group.append("g")
                            .attr("class", "collapse-btn")
                            .attr("transform", `translate(0, ${rectHeight / 2})`)
                            .on("click", (event) => toggleCollapse(event, d.data.id));

                        btnGroup.append("circle")
                            .attr("r", 13)
                            .attr("fill", "#1e40af")
                            .attr("stroke", "#ffffff")
                            .attr("stroke-width", "2.5px");

                        btnGroup.append("text")
                            .attr("text-anchor", "middle")
                            .attr("dy", "4px")
                            .attr("fill", "#ffffff")
                            .attr("font-size", "14px")
                            .attr("font-weight", "bold")
                            .text(isCollapsed ? "+" : "-");
                    }
                });
            } catch (error) {
                console.error("Tree render error:", error);
            }
        }

        window.handleSearch = function(query) {
            const resultsBox = document.getElementById('search-results');
            if (!query.trim()) {
                resultsBox.classList.add('hidden');
                resultsBox.innerHTML = '';
                return;
            }

            const lowerQuery = query.toLowerCase();
            const matches = familyData.filter(n => {
                if (n.name && n.name.toLowerCase().includes(lowerQuery)) return true;
                if (n.birthYear && n.birthYear.toString().includes(lowerQuery)) return true;
                if (n.spouses && n.spouses.some(s => s.name && s.name.toLowerCase().includes(lowerQuery))) return true;
                return false;
            });

            if (matches.length === 0) {
                resultsBox.innerHTML = '<div class="p-4 text-sm text-gray-500 text-center font-bold">Nama tidak ditemukan</div>';
                resultsBox.classList.remove('hidden');
                return;
            }

            let html = '';
            matches.forEach(m => {
                let spouseSummary = '';
                if (m.spouses && m.spouses.length > 0) {
                    const spouseNames = m.spouses.map(s => s.name).filter(Boolean).join(', ');
                    if (spouseNames) spouseSummary = ` • Pasangan: ${spouseNames}`;
                }

                html += `<div onclick="focusNode('${m.id}')" class="p-3.5 hover:bg-blue-50 cursor-pointer border-b border-gray-100 text-sm transition-colors">
                    <p class="font-extrabold text-blue-950">${m.name} ${m.birthYear ? '(' + m.birthYear + ')' : ''}</p>
                    <p class="text-xs text-gray-600 font-medium">${spouseSummary}</p>
                </div>`;
            });
            resultsBox.innerHTML = html;
            resultsBox.classList.remove('hidden');
        };

        window.focusNode = function(id) {
            let curr = familyData.find(n => n.id === id);
            if (curr) {
                while (curr && curr.parentId) {
                    collapsedNodeIds[curr.parentId] = false;
                    curr = familyData.find(n => n.id === curr.parentId);
                }

                selectNode(familyData.find(n => n.id === id));
                document.getElementById('search-results').classList.add('hidden');
                document.getElementById('search-input').value = '';
                updateTree(); 

                const nodeGroup = d3.selectAll(".node").filter(d => d.data.id === id);
                if (!nodeGroup.empty()) {
                    const bound = nodeGroup.node().getBoundingClientRect();
                    const cw = container.clientWidth;
                    const ch = container.clientHeight;
                    const currentTransform = d3.zoomTransform(svg.node());
                    const targetX = currentTransform.x + (cw / 2) - (bound.left + bound.width / 2);
                    const targetY = currentTransform.y + (ch / 2) - (bound.top + bound.height / 2);
                    
                    svg.transition().duration(500).call(
                        zoom.transform,
                        d3.zoomIdentity.translate(targetX, targetY).scale(currentTransform.k)
                    );
                }
            }
        };

        let isMobilePanelOpen = true;
        const uiPanel = document.getElementById('ui-panel');
        let dragStartY = 0, panelCurrentY = 0, isDraggingPanel = false, panelClosedY = 0;

        function toggleMobilePanel(forceOpen = false) {
            if (window.innerWidth >= 768) return; 
            uiPanel.style.transitionDuration = ''; 
            const closedY = uiPanel.offsetHeight - 50; 
            if (!isMobilePanelOpen || forceOpen) {
                uiPanel.style.transform = 'translateY(0)'; 
                isMobilePanelOpen = true;
            } else {
                uiPanel.style.transform = `translateY(${closedY}px)`; 
                isMobilePanelOpen = false;
            }
        }
        window.toggleMobilePanel = toggleMobilePanel;

        uiPanel.addEventListener('touchstart', (e) => {
            if (window.innerWidth >= 768) return;
            if (e.target.closest('#mobile-handle') || e.target.closest('h1') || !isMobilePanelOpen) {
                isDraggingPanel = true;
                dragStartY = e.touches[0].clientY;
                panelClosedY = uiPanel.offsetHeight - 50;
                panelCurrentY = isMobilePanelOpen ? 0 : panelClosedY;
                uiPanel.style.transitionDuration = '0ms';
            }
        }, {passive: true});

        uiPanel.addEventListener('touchmove', (e) => {
            if (!isDraggingPanel) return;
            const deltaY = e.touches[0].clientY - dragStartY;
            let newY = panelCurrentY + deltaY;
            if (newY < 0) newY = 0;
            if (newY > panelClosedY) newY = panelClosedY;
            uiPanel.style.transform = `translateY(${newY}px)`;
        }, {passive: true});

        uiPanel.addEventListener('touchend', () => {
            if (!isDraggingPanel) return;
            isDraggingPanel = false;
            uiPanel.style.transitionDuration = '';
            const matrix = new DOMMatrixReadOnly(window.getComputedStyle(uiPanel).transform);
            if (matrix.m42 > (panelClosedY / 2)) {
                uiPanel.style.transform = `translateY(${panelClosedY}px)`;
                isMobilePanelOpen = false;
            } else {
                uiPanel.style.transform = 'translateY(0)';
                isMobilePanelOpen = true;
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                uiPanel.style.transform = 'none';
                isMobilePanelOpen = true;
            } else if (!isMobilePanelOpen) {
                uiPanel.style.transform = `translateY(${uiPanel.offsetHeight - 50}px)`;
            }
        });

                    });

            } else if (action === 'add_spouse') {

                childSpouseSection.style.display = 'none';

                spouseSection.style.display = 'block';
                childSpouseSection.style.display = 'none';
                nameInput.setAttribute('required', 'true');
                
                const node = familyData.find(n => n.id === selectedNodeId);
                nameInput.value = node.name || '';

                document.getElementById('birthYear').value = node.birthYear || '';
                
                if (node.parentId) {
                    editSiblingSection.style.display = 'block';
                    const mySpouseIdx = node.parentSpouseIndex !== undefined ? node.parentSpouseIndex : 0;
                    const sameMotherSiblings = familyData.filter(n => {
                        if (n.parentId !== node.parentId) return false;
                        const sIdx = n.parentSpouseIndex !== undefined ? n.parentSpouseIndex : 0;
                        return sIdx === mySpouseIdx;
                    });
                    const currentIdx = sameMotherSiblings.findIndex(n => n.id === node.id);
                    document.getElementById('editSiblingPosition').value = currentIdx !== -1 ? currentIdx + 1 : 1;
                } else {
                    editSiblingSection.style.display = 'none';
                }

                const activeIdx = activeSpouseIndices[node.id] || 0;
                const activeSpouse = node.spouses && node.spouses[activeIdx] ? node.spouses[activeIdx] : {};
                spouseNameInput.value = activeSpouse.name || '';

        function handleFormSubmit(event) {
            event.preventDefault();
            const action = document.getElementById('form-action').value;
            const name = document.getElementById('name').value;
            const mainAlm = document.getElementById('mainAlm').checked;
            const birthYear = document.getElementById('birthYear').value;
            const spouseName = document.getElementById('spouseName').value;
            const spouseAlm = document.getElementById('spouseAlm').checked;
            const spouseBirthYear = document.getElementById('spouseBirthYear').value;

            const spouseObj = spouseName ? { name: spouseName, spouseAlm, spouseBirthYear } : null;

            if (action === 'root') {
                familyData.push({ 
                    id: nextId.toString(), 
                    parentId: null, 
                    name, 
                    mainAlm, 
                    birthYear, 
                    spouses: spouseObj ? [spouseObj] : [] 
                });
                selectNode(familyData[familyData.length - 1]); 
                nextId++;
            } 
            else if (action === 'child' && selectedNodeId) {
                const parentNode = familyData.find(n => n.id === selectedNodeId);
                const selectedSpouseIdx = document.getElementById('childSpouseIndex').value;

                familyData.push({ 
                    id: nextId.toString(), 
                    parentId: selectedNodeId, 
                    parentSpouseIndex: parentNode && parentNode.spouses && parentNode.spouses.length > 0 ? parseInt(selectedSpouseIdx) : 0,
                    name, 
                    mainAlm, 
                    birthYear, 
                    spouses: spouseObj ? [spouseObj] : [] 
                });
                nextId++;
            }
            else if (action === 'add_spouse' && selectedNodeId) {
                const node = familyData.find(n => n.id === selectedNodeId);
                if (node) {
                    if (!node.spouses) node.spouses = [];
                    node.spouses.push(spouseObj);
                    activeSpouseIndices[node.id] = node.spouses.length - 1;
                    selectNode(node);
                }
            }
            else if (action === 'edit' && selectedNodeId) {
                const nodeIndex = familyData.findIndex(n => n.id === selectedNodeId);
                if (nodeIndex !== -1) {
                    familyData[nodeIndex].name = name;
                    familyData[nodeIndex].mainAlm = mainAlm;
                    familyData[nodeIndex].birthYear = birthYear;
                    
                    if (!familyData[nodeIndex].spouses) familyData[nodeIndex].spouses = [];
                    const activeIdx = activeSpouseIndices[selectedNodeId] || 0;
                    if (spouseName) {
                        if (familyData[nodeIndex].spouses[activeIdx]) {
                            familyData[nodeIndex].spouses[activeIdx] = { name: spouseName, spouseAlm, spouseBirthYear };
                        } else {
                            familyData[nodeIndex].spouses.push({ name: spouseName, spouseAlm, spouseBirthYear });
                            activeSpouseIndices[selectedNodeId] = familyData[nodeIndex].spouses.length - 1;
                        }
                    } else if (familyData[nodeIndex].spouses[activeIdx]) {
                        familyData[nodeIndex].spouses.splice(activeIdx, 1);
                        activeSpouseIndices[selectedNodeId] = 0;
                    }

                    const node = familyData[nodeIndex];
                    if (node.parentId) {
                        const newPosInput = document.getElementById('editSiblingPosition').value;
                        if (newPosInput) {
                            const targetPosition = parseInt(newPosInput) - 1;
                            const mySpouseIdx = node.parentSpouseIndex !== undefined ? node.parentSpouseIndex : 0;
                            
                            let allSiblings = familyData.filter(n => n.parentId === node.parentId);
                            let sameMotherSiblings = allSiblings.filter(n => {
                                const sIdx = n.parentSpouseIndex !== undefined ? n.parentSpouseIndex : 0;
                                return sIdx === mySpouseIdx;
                            });

                            const oldIndex = sameMotherSiblings.findIndex(n => n.id === node.id);
                            if (oldIndex !== -1 && targetPosition >= 0 && targetPosition < sameMotherSiblings.length && oldIndex !== targetPosition) {
                                const [movedItem] = sameMotherSiblings.splice(oldIndex, 1);
                                sameMotherSiblings.splice(targetPosition, 0, movedItem);

                                let otherData = familyData.filter(n => {
                                    if (n.parentId !== node.parentId) return true;
                                    const sIdx = n.parentSpouseIndex !== undefined ? n.parentSpouseIndex : 0;
                                    return sIdx !== mySpouseIdx;
                                });
                                familyData = otherData;
                                familyData.push(...sameMotherSiblings); 
                            }
                        }
                    }
                    selectNode(familyData[nodeIndex]); 
                }
            }

            closeModal();
            updateTree();
            syncToCloud(); 
            if(action === 'root') setTimeout(resetView, 100);
        }
        window.handleFormSubmit = handleFormSubmit;

        function confirmDelete() {
            if (!selectedNodeId) return;
            const node = familyData.find(n => n.id === selectedNodeId);
            
            if(confirm(`Yakin ingin menghapus data "${node.name}" beserta seluruh keturunannya?`)) {
                const getDescendantIds = (parentId) => {
                    let ids = [parentId];
                    const children = familyData.filter(n => n.parentId === parentId);
                    for (const child of children) ids = ids.concat(getDescendantIds(child.id));
                    return ids;
                };

                const idsToDelete = getDescendantIds(selectedNodeId);
                familyData = familyData.filter(n => !idsToDelete.includes(n.id));

                if (isolatedParentId && idsToDelete.includes(isolatedParentId)) {
                    resetFamilyFilter();
                }

                selectedNodeId = null;
                document.getElementById('selected-info').classList.add('hidden');
                updateTree();
                syncToCloud(); 
                showToast("Data berhasil dihapus");
            }
        }
        window.confirmDelete = confirmDelete;

        function downloadTreeImage() {
            if (familyData.length === 0) return showToast("Belum ada data untuk diunduh!");
            showToast("Sedang memproses gambar...");
            const svgElement = document.querySelector('#tree-container svg');
            const gElement = svgElement.querySelector('g');
            const bbox = gElement.getBBox();
            const margin = 100, width = bbox.width + (margin * 2), height = bbox.height + (margin * 2);
            
            const clone = svgElement.cloneNode(true);
            clone.setAttribute('width', width); clone.setAttribute('height', height);
            clone.querySelector('g').setAttribute('transform', `translate(${-bbox.x + margin}, ${-bbox.y + margin})`);

            const styleEl = document.createElement('style');
            styleEl.textContent = `.link{fill:none;stroke:#64748b;stroke-width:3.5px}.text-main-name{font-weight:bold;font-size:14px;fill:#fff;text-anchor:middle;font-family:Arial,sans-serif}.text-spouse-name{font-weight:bold;font-size:14px;fill:#0f172a;text-anchor:middle;font-family:Arial,sans-serif}.text-main-detail{font-size:11px;fill:#eff6ff;text-anchor:middle;font-family:Arial,sans-serif}.text-spouse-detail{font-size:11px;fill:#475569;text-anchor:middle;font-family:Arial,sans-serif}.couple-link{stroke:#64748b;stroke-width:3.5px}`;
            clone.insertBefore(styleEl, clone.firstChild);

            const svgString = new XMLSerializer().serializeToString(clone);
            const img = new Image();
            const DOMURL = window.URL || window.webkitURL || window;
            const url = DOMURL.createObjectURL(new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' }));

            img.onload = () => {
                const scale = 3, canvas = document.createElement('canvas');
                canvas.width = width * scale; canvas.height = height * scale;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
                
                const link = document.createElement('a');
                link.download = 'Silsilah_Keluarga.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                DOMURL.revokeObjectURL(url);
                showToast("Gambar berhasil diunduh!");
            };
            img.src = url;
        }
        window.downloadTreeImage = downloadTreeImage;

        let db, auth, docRef;
        window.initialViewDone = false;

        async function initCloud() {
            const cloudStatus = document.getElementById('cloud-status');
            try {
                const firebaseConfig = {
                    apiKey: "AIzaSyBLxKcMg9anSKgGiref3NQDdm9AZWta6xI",
                    authDomain: "keluargaabadi016.firebaseapp.com",
                    projectId: "keluargaabadi016",
                    storageBucket: "keluargaabadi016.firebasestorage.app",
                    messagingSenderId: "468992400632",
                    appId: "1:468992400632:web:f70b711736f0c6510c2f0d"
                };

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-silsilah-id';
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app); db = getFirestore(app);
                
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) await signInWithCustomToken(auth, token);
                else await signInAnonymously(auth); 

                docRef = doc(db, 'artifacts', appId, 'public', 'data', 'familyTree', 'mainTree');

                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        familyData = docSnap.data().nodes || [];
                        familyData.forEach(n => {
                            if (!n.spouses && n.spouseName) {
                                n.spouses = [{ name: n.spouseName, spouseAlm: n.spouseAlm, spouseBirthYear: n.spouseBirthYear }];
                            } else if (!n.spouses) {
                                n.spouses = [];
                            }
                        });
                        nextId = familyData.length > 0 ? Math.max(...familyData.map(n => parseInt(n.id))) + 1 : 1;
                    } else familyData = [];
                    
                    updateTree(); 
                    if(!window.initialViewDone && familyData.length > 0) {
                        setTimeout(resetView, 300);
                        window.initialViewDone = true;
                    }
                    if(cloudStatus) { cloudStatus.textContent = 'Cloud Aktif ☁️'; cloudStatus.className = 'text-xs bg-green-100 text-green-800 px-3 py-1 rounded-full font-bold shadow-sm'; }
                }, () => {
                    if(cloudStatus) { cloudStatus.textContent = 'Terputus'; cloudStatus.className = 'text-xs bg-red-100 text-red-800 px-3 py-1 rounded-full font-bold'; }
                });
            } catch (error) {
                if(cloudStatus) cloudStatus.textContent = 'Gagal Koneksi';
            }
        }

        async function syncToCloud() {
            if (!auth || !auth.currentUser || !docRef) return;
            try { await setDoc(docRef, { nodes: familyData }); } 
            catch (error) { showToast("Gagal menyimpan ke cloud."); }
        }

        window.onload = initCloud;
    </script>
</body>
